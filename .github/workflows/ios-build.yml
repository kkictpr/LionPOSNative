
name: LionPOS iOS Build

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm install

      - name: Install CocoaPods
        run: |
          cd ios
          pod install

      - name: Build iOS (No Signing)
        run: |
          cd ios
          xcodebuild \
            -workspace LionPOSNative.xcworkspace \
            -scheme LionPOSNative \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO